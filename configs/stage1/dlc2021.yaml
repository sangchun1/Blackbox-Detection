# Stage 1 data configuration: DLC-2021 (current pretraining source).
#
# DLC-2021 provides real screen recaptures, but its content is document centric
# while the DACON target domain is dashcam video. The goal of this stage is a
# content-independent recapture representation, not a good document classifier.
# Resolution, FPS and codec are recorded for analysis and split diagnostics only
# and are never used as classifier inputs.

dataset:
  name: dlc2021
  # Absolute or repository-relative path to the DLC-2021 root that contains the
  # subset directories. Set this locally; it is machine specific.
  root: null
  scene_type: document
  # Only the real recapture pair is used. 'cc' and 'cg' are ignored.
  label_directories:
    or: ORIGINAL
    re: RERECORDED
  probe_metadata: true
  verify_decode: true
  drop_broken: true

split:
  val_size: 0.2
  seed: 42
  # 'auto' -> group-aware when any source_video_id is known (future paired CCD),
  # stratified otherwise. DLC-2021 has no verifiable pairing, so it stays
  # stratified; no artificial grouping is created.
  strategy: auto
  stratify_columns: [dataset, label]
  group_column: source_video_id

# VAL-A is the full stratified validation set. VAL-B subsets below are
# shortcut diagnostics and are reported only when enough videos per class exist.
validation_subsets:
  - name: val_b_high_resolution
    column: height
    minimum: 2000
    min_per_class: 20
    description: >-
      High-resolution-only subset, used to check how much of the score depends
      on a resolution shortcut rather than on recapture artefacts.

paths:
  manifest: outputs/stage1/manifests/dlc2021.csv
  split: outputs/stage1/splits/dlc2021_seed42.csv
