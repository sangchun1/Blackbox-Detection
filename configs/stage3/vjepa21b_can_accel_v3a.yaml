seed: 20260918

experiment:
  name: vjepa21b_can_v3a_ordinal_frozen

data:
  clip_len: 16
  window_stride: 16
  input_height: 288
  input_width: 384
  num_workers: 2
  train_random_flip: true
  max_train_windows: 12000
  max_val_windows: 4000

model:
  backbone: vjepa2_1_vit_base_384
  out_layers: [2, 5, 8, 11]
  freeze_backbone: true
  temporal_hidden: 256
  temporal_layers: 2
  feature_dim: 384

  # Training-only auxiliary branch. These are NOT DACON class thresholds.
  # The head predicts, for each threshold, two cumulative events:
  #   P(a < -threshold) and P(a > +threshold).
  accel_ordinal_thresholds_mps2: [0.10, 0.20, 0.30, 0.50]

# Controlled v3-A experiment:
# same frozen backbone, data budget, optimizer, scheduler, and v2 continuous
# objectives. The only intended modeling change is the explicit ordinal head
# plus its auxiliary loss.
training:
  epochs: 4
  batch_size: 2
  grad_accum_steps: 4
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.10
  min_learning_rate_ratio: 0.01
  grad_clip_norm: 1.0
  amp_dtype: bf16
  max_steps_per_epoch: 2000
  max_val_steps: 500
  early_stopping_patience: 0
  log_interval: 20

# metrics.py remains untouched. All losses below are continuous-CAN or
# training-only auxiliary objectives.
loss:
  mode: accel_v3_ordinal

  weights:
    speed_mps: 1.0
    accel_from_speed_mps2: 1.5
    steering_deg: 1.5
    yaw_rate_rps: 0.75

  # Notebook 08 injects target_stats.json here at runtime.
  normalization: {}

  # Keep v2 exactly as-is so v3-A is an interpretable additive ablation.
  accel_v2:
    magnitude_weighted_regression:
      scale_mps2: 0.30
      gain: 2.0
      max_weight: 3.0
      beta: 0.5

    multi_threshold_margin:
      weight: 0.75
      thresholds_mps2: [0.10, 0.20, 0.30, 0.50]
      temperature_mps2: 0.05

    speed_delta:
      weight: 0.5
      beta_normalized: 0.01

    speed_accel_consistency:
      weight: 0.10
      speed_delta_scale_normalized: 0.01
      accel_scale_normalized: 0.50
      beta: 0.50

  accel_v3:
    ordinal:
      # Balanced BCE independently for DECEL and ACCEL at each threshold.
      # This explicitly prevents the auxiliary task from solving DECEL by
      # always predicting the negative class.
      weight: 0.75
      thresholds_mps2: [0.10, 0.20, 0.30, 0.50]

      # Enforce cumulative ordering across thresholds:
      # P(|a| > 0.50) <= ... <= P(|a| > 0.10), per direction.
      monotonic_weight: 0.10

# Diagnostic only. These are NOT DACON's hidden labeling thresholds.
validation:
  backfill_on_resume: true
  proxy_rules:
    sensitive:
      stop_speed_mps: 0.30
      accel_deadzone_mps2: 0.10
      steer_deadzone_deg: 2.0
    medium:
      stop_speed_mps: 0.50
      accel_deadzone_mps2: 0.20
      steer_deadzone_deg: 5.0
    conservative:
      stop_speed_mps: 1.00
      accel_deadzone_mps2: 0.30
      steer_deadzone_deg: 8.0

logging:
  wandb_enabled: true
  wandb_project: blackbox-stage3
  wandb_group: vjepa21b_can_accel_v3a
