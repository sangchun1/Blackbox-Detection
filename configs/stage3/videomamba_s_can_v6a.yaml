seed: 20260918

experiment:
  name: videomamba_s_can_v6a_backbone_ablation
  baseline_run: vjepa21b_can_v5d_accel_decision
  baseline_checkpoint: best_accel_proxy.pt
  purpose: backbone_only_ablation

data:
  clip_len: 32
  train_window_stride: 16
  val_window_stride: 16
  input_height: 288
  input_width: 384
  num_workers: 2
  val_num_workers: 0
  train_random_flip: true

  sampler:
    inverse_frequency_power: 0.35
    max_normalized_weight: 30.0
    event_multipliers:
      cruise: 0.55
      turn: 1.50
      moderate_accel: 2.75
      moderate_decel: 3.25
      moderate_mixed: 3.75
      hard_accel: 4.25
      hard_decel: 4.75
      hard_mixed: 5.00
      stop_start: 4.00
      reversal: 2.00
    source_multipliers:
      comma2k19: 1.0
      a2d2: 20.0

  sources:
    comma2k19:
      steering_direction_deadzone_deg: 2.0
      steering_activity_scale_deg: 8.0
      steering_sign_multiplier: 1.0
    a2d2:
      steering_direction_deadzone_deg: 10.0
      steering_activity_scale_deg: 60.0
      steering_sign_multiplier: 1.0

model:
  backbone: videomamba_small
  official_repo: OpenGVLab/VideoMamba
  official_commit: 37355c26d0ae99ca2459f6d4044a5f509031a79f
  official_checkpoint_repo: OpenGVLab/VideoMamba
  official_checkpoint: videomamba_s16_k400_f32_res224.pth
  official_pretraining: ImageNet-1K_then_Kinetics-400
  official_input_frames: 32
  official_resolution: 224
  embed_dim: 384
  depth: 24
  tubelet_size: 1

  temporal_hidden: 256
  temporal_layers: 2
  feature_dim: 384

  spatial_pool:
    grid: [3, 4]
    gate_init: 0.10

  accel_ordinal_thresholds_mps2: [0.10, 0.20, 0.30, 0.50]
  accel_fusion:
    enabled: true
    hidden: 64
    gate_init: 0.10
    detach_ordinal_inputs: true

  accel_state:
    thresholds_mps2: [0.10, 0.20, 0.30, 0.50]
    hidden: 96
    dropout: 0.10

  stop_thresholds_mps: [0.10, 0.30, 0.50, 1.00, 2.00]
  turn_yaw_thresholds_rps: [0.01, 0.03, 0.05]
  steer_activity_thresholds: [0.25, 0.50, 1.00, 2.00]
  brake_thresholds_bar: [0.50, 2.00, 5.00]
  throttle_thresholds_pct: [1.00, 5.00, 10.00]

  backbone_finetune:
    last_n_layers: 2
    train_final_norm: true

training:
  epochs: 2
  batch_size: 1
  grad_accum_steps: 8

  interface_learning_rate: 0.000050
  head_learning_rate: 0.000010
  accel_state_head_learning_rate: 0.000050
  penultimate_layer_learning_rate: 0.000001
  last_layer_learning_rate: 0.000002
  final_norm_learning_rate: 0.000002

  interface_weight_decay: 0.01
  head_weight_decay: 0.01
  accel_state_head_weight_decay: 0.01
  backbone_weight_decay: 0.05

  warmup_ratio: 0.10
  min_learning_rate_ratio: 0.10
  grad_clip_norm: 1.0
  amp_dtype: bf16

  max_steps_per_epoch: 2000
  max_val_steps: 800
  early_stopping_patience: 0
  log_interval: 20

warm_start:
  run_name: vjepa21b_can_v5d_accel_decision
  checkpoint: best_accel_proxy.pt
  mode: compatible_downstream

loss:
  base:
    mode: accel_v4_fusion
    weights:
      speed_mps: 1.0
      accel_from_speed_mps2: 1.5
      steering_deg: 1.5
      yaw_rate_rps: 0.75
    normalization: {}

    accel_v2:
      magnitude_weighted_regression:
        scale_mps2: 0.30
        gain: 2.0
        max_weight: 3.0
        beta: 0.5
      multi_threshold_margin:
        weight: 0.90
        thresholds_mps2: [0.10, 0.20, 0.30, 0.50]
        temperature_mps2: 0.05
      speed_delta:
        weight: 0.60
        beta_normalized: 0.01
      speed_accel_consistency:
        weight: 0.15
        speed_delta_scale_normalized: 0.01
        accel_scale_normalized: 0.50
        beta: 0.50

    accel_v3:
      ordinal:
        weight: 0.75
        thresholds_mps2: [0.10, 0.20, 0.30, 0.50]
        monotonic_weight: 0.10

    accel_v4:
      fusion:
        diagnostics_only: true

  stop_ordinal:
    weight: 0.50
    thresholds_mps: [0.10, 0.30, 0.50, 1.00, 2.00]
    monotonic_weight: 0.10

  delta_speed:
    weight: 0.75
    beta_mps: 0.05
    dt_s: 0.10
    accel_consistency_weight: 0.20
    consistency_beta_mps2: 0.20

  accel_state:
    weight: 0.75
    thresholds_mps2: [0.10, 0.20, 0.30, 0.50]
    label_smoothing: 0.02
    monotonic_weight: 0.05

  accel_temporal_gradient:
    weight: 0.15
    horizons: [1, 2, 4]
    beta_normalized: 0.10

  integrated_kinematics:
    weight: 0.30
    horizons: [1, 2, 4]
    dt_s: 0.10
    beta_mps: 0.05

  turn_ordinal:
    weight: 0.25
    thresholds_rps: [0.01, 0.03, 0.05]
    monotonic_weight: 0.10

  steer_direction:
    weight: 0.20

  steer_activity_ordinal:
    weight: 0.10
    thresholds: [0.25, 0.50, 1.00, 2.00]
    monotonic_weight: 0.10

  brake_ordinal:
    weight: 0.10
    thresholds_bar: [0.50, 2.00, 5.00]
    monotonic_weight: 0.10

  throttle_ordinal:
    weight: 0.05
    thresholds_pct: [1.00, 5.00, 10.00]
    monotonic_weight: 0.10

validation:
  proxy_rules:
    sensitive:
      stop_speed_mps: 0.30
      accel_deadzone_mps2: 0.10
      steer_deadzone_deg: 2.0
    medium:
      stop_speed_mps: 0.50
      accel_deadzone_mps2: 0.20
      steer_deadzone_deg: 5.0
    conservative:
      stop_speed_mps: 1.00
      accel_deadzone_mps2: 0.30
      steer_deadzone_deg: 8.0

  acceptance:
    min_accel_delta_vs_v5d_anchor: 0.005
    min_medium_accelerating_delta: 0.0
    max_dynamic_to_constant_delta: 0.0

inference_lock:
  clip_len: 32
  stride: 8
  center_floor: 0.25
  stop_weight: 0.75
  accel_weight: 0.0
  steer_weight: 0.30
  turn_weight: 0.30
  state_weight: 0.0

logging:
  wandb_enabled: true
  wandb_project: blackbox-stage3
  wandb_group: videomamba_s_can_v6a
