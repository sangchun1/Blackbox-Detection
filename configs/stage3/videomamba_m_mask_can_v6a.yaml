validation:
  proxy_rules:
    sensitive:
      stop_speed_mps: 0.3
      accel_deadzone_mps2: 0.1
      steer_deadzone_deg: 2.0
    medium:
      stop_speed_mps: 0.5
      accel_deadzone_mps2: 0.2
      steer_deadzone_deg: 5.0
    conservative:
      stop_speed_mps: 1.0
      accel_deadzone_mps2: 0.3
