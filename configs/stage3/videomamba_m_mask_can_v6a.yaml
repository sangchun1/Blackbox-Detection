seed: 20260918
experiment:
  name: videomamba_m_mask_can_v6a_backbone_ablation
  baseline_run: vjepa21b_can_v5d_accel_decision
  baseline_checkpoint: best_accel_proxy.pt
  purpose: backbone_only_ablation
data:
  clip_len: 32
  train_window_stride: 16
  val_window_stride: 16
  input_height: 288
  input_width: 384
  num_workers: 2
  val_num_workers: 0
  train_random_flip: true
  sampler:
    inverse_frequency_power: 0.35
    max_normalized_weight: 30.0
    event_multipliers:
      cruise: 0.55
      turn: 1.5
      moderate_accel: 2.75
      moderate_decel: 3.25
      moderate_mixed: 3.75
      hard_accel: 4.25
      hard_decel: 4.75
      hard_mixed: 5.0
      stop_start: 4.0
      reversal: 2.0
    source_multipliers:
      comma2k19: 1.0
      a2d2: 20.0
  sources:
    comma2k19:
      steering_direction_deadzone_deg: 2.0
      steering_activity_scale_deg: 8.0
      steering_sign_multiplier: 1.0
    a2d2:
      steering_direction_deadzone_deg: 10.0
      steering_activity_scale_deg: 60.0
      steering_sign_multiplier: 1.0
model:
  backbone: videomamba_middle
  official_repo: OpenGVLab/VideoMamba
  official_commit: 37355c26d0ae99ca2459f6d4044a5f509031a79f
  official_checkpoint_repo: OpenGVLab/VideoMamba
  official_checkpoint: videomamba_m16_k400_mask_ft_f32_res224.pth
  official_pretraining: masked_video_pretraining_then_Kinetics-400
  official_input_frames: 32
  official_resolution: 224
  embed_dim: 576
  depth: 32
  tubelet_size: 1
  temporal_hidden: 256
  temporal_layers: 2
  feature_dim: 384
  spatial_pool:
    grid:
    - 3
    - 4
    gate_init: 0.1
  accel_ordinal_thresholds_mps2:
  - 0.1
  - 0.2
  - 0.3
  - 0.5
  accel_fusion:
    enabled: true
    hidden: 64
    gate_init: 0.1
    detach_ordinal_inputs: true
  accel_state:
    thresholds_mps2:
    - 0.1
    - 0.2
    - 0.3
    - 0.5
    hidden: 96
    dropout: 0.1
  stop_thresholds_mps:
  - 0.1
  - 0.3
  - 0.5
  - 1.0
  - 2.0
  turn_yaw_thresholds_rps:
  - 0.01
  - 0.03
  - 0.05
  steer_activity_thresholds:
  - 0.25
  - 0.5
  - 1.0
  - 2.0
  brake_thresholds_bar:
  - 0.5
  - 2.0
  - 5.0
  throttle_thresholds_pct:
  - 1.0
  - 5.0
  - 10.0
  backbone_finetune:
    last_n_layers: 2
    train_final_norm: true
    checkpoint_trainable: true
training:
  epochs: 2
  batch_size: 1
  grad_accum_steps: 8
  interface_learning_rate: 5.0e-05
  head_learning_rate: 1.0e-05
  accel_state_head_learning_rate: 5.0e-05
  penultimate_layer_learning_rate: 1.0e-06
  last_layer_learning_rate: 2.0e-06
  final_norm_learning_rate: 2.0e-06
  interface_weight_decay: 0.01
  head_weight_decay: 0.01
  accel_state_head_weight_decay: 0.01
  backbone_weight_decay: 0.05
  warmup_ratio: 0.1
  min_learning_rate_ratio: 0.1
  grad_clip_norm: 1.0
  amp_dtype: bf16
  max_steps_per_epoch: 2000
  max_val_steps: 800
  early_stopping_patience: 0
  log_interval: 20
warm_start:
  run_name: vjepa21b_can_v5d_accel_decision
  checkpoint: best_accel_proxy.pt
  mode: compatible_downstream
