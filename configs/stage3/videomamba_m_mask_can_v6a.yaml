    - 0.1
    - 0.3
    - 0.5
    - 1.0
    - 2.0
    monotonic_weight: 0.1
  delta_speed:
    weight: 0.75
    beta_mps: 0.05
    dt_s: 0.1
    accel_consistency_weight: 0.2
    consistency_beta_mps2: 0.2
  accel_state:
    weight: 0.75
    thresholds_mps2:
    - 0.1
    - 0.2
    - 0.3
    - 0.5
    label_smoothing: 0.02
    monotonic_weight: 0.05
  accel_temporal_gradient:
    weight: 0.15
    horizons:
    - 1
    - 2
    - 4
    beta_normalized: 0.1
  integrated_kinematics:
    weight: 0.3
    horizons:
    - 1
    - 2
    - 4
    dt_s: 0.1
    beta_mps: 0.05
  turn_ordinal:
    weight: 0.25
    thresholds_rps:
    - 0.01
    - 0.03
    - 0.05
    monotonic_weight: 0.1
  steer_direction:
    weight: 0.2
  steer_activity_ordinal:
    weight: 0.1
    thresholds:
    - 0.25
    - 0.5
    - 1.0
    - 2.0
