seed: 20260918

experiment:
  name: vjepa21b_can_v1

data:
  clip_len: 16
  window_stride: 16
  input_height: 288
  input_width: 384
  num_workers: 2
  train_random_flip: true
  max_train_windows: 12000
  max_val_windows: 4000

model:
  backbone: vjepa2_1_vit_base_384
  out_layers: [2, 5, 8, 11]
  freeze_backbone: true
  temporal_hidden: 256
  temporal_layers: 2
  feature_dim: 384

training:
  epochs: 4
  batch_size: 2
  grad_accum_steps: 4
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.10
  min_learning_rate_ratio: 0.01
  grad_clip_norm: 1.0
  amp_dtype: bf16
  max_steps_per_epoch: 2000
  max_val_steps: 500
  early_stopping_patience: 0
  log_interval: 20

loss:
  speed_mps: 1.0
  accel_from_speed_mps2: 1.5
  steering_deg: 1.5
  yaw_rate_rps: 0.75

# Diagnostic only. These are NOT DACON's hidden labeling thresholds.
# They convert continuous comma2k19 CAN targets/predictions into several
# Stage-3-like proxy labelings, then score those labels with the locked
# DACON Macro-F1 semantics from metrics.py.
validation:
  backfill_on_resume: true
  proxy_rules:
    sensitive:
      stop_speed_mps: 0.30
      accel_deadzone_mps2: 0.10
      steer_deadzone_deg: 2.0
    medium:
      stop_speed_mps: 0.50
      accel_deadzone_mps2: 0.20
      steer_deadzone_deg: 5.0
    conservative:
      stop_speed_mps: 1.00
      accel_deadzone_mps2: 0.30
      steer_deadzone_deg: 8.0

logging:
  wandb_enabled: true
  wandb_project: blackbox-stage3
  wandb_group: vjepa21b_can
